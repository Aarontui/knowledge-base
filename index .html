<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global PDF Knowledge Base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#6B7280',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-primary">
                    <i class="fas fa-book-open mr-2"></i>PDF Knowledge Base
                </h1>
                <div class="relative w-64">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search documents..." 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary"
                    >
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 分类标签 -->
        <div class="mb-8">
            <div class="flex flex-wrap gap-2" id="categoryTabs">
                <button class="category-tab active px-4 py-2 rounded-lg bg-primary text-white font-medium transition-all" data-category="all">
                    All Documents
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="Processor">
                    Processor
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="product">
                    Product
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="repair">
                    Repair
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="Maintance">
                    Maintance
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="Calibration">
                    Calibration
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="software">
                    Software
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="Q&A">
                    Q&A
                </button>
                <button class="category-tab px-4 py-2 rounded-lg bg-white text-secondary font-medium hover:bg-gray-100 transition-all" data-category="others">
                    Others
                </button>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800" id="currentCategoryTitle">All Documents</h2>
                <p class="text-sm text-gray-500 mt-1" id="fileCount">Loading files...</p>
            </div>
            <div id="fileList" class="divide-y divide-gray-100">
                <div class="p-8 text-center text-gray-500">
                    <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                    <p>Loading documents...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-500 text-sm">
            <p>© 2025 PDF Knowledge Base. Powered by GitHub & Cloudflare.</p>
        </div>
    </footer>

    <!-- PDF预览模态框 -->
    <div id="pdfModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-6xl h-[90vh] flex flex-col">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="pdfTitle" class="text-lg font-semibold text-gray-800 truncate"></h3>
                <button id="closeModal" class="text-gray-500 hover:text-gray-700 text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="flex-1 overflow-hidden">
                <iframe id="pdfViewer" class="w-full h-full" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script>
        // 配置 - 替换为你的GitHub用户名和仓库名
        const GITHUB_USER = 'your-github-username';
        const GITHUB_REPO = 'pdf-knowledge-base';
        const GITHUB_BRANCH = 'main';

        const categories = ['Processor', 'product', 'repair', 'Maintance', 'Calibration', 'software', 'Q&A', 'others'];
        let allFiles = [];
        let currentCategory = 'all';

        // 获取GitHub仓库中的所有PDF文件
        async function fetchAllFiles() {
            allFiles = [];
            
            for (const category of categories) {
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${category}?ref=${GITHUB_BRANCH}`);
                    if (!response.ok) continue;
                    
                    const files = await response.json();
                    const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));
                    
                    pdfFiles.forEach(file => {
                        allFiles.push({
                            name: file.name.replace('.pdf', '').replace(/-/g, ' ').replace(/_/g, ' '),
                            filename: file.name,
                            category: category,
                            url: file.download_url,
                            size: (file.size / 1024 / 1024).toFixed(2),
                            lastUpdated: new Date(file.last_modified).toLocaleDateString()
                        });
                    });
                } catch (error) {
                    console.error(`Error fetching files from ${category}:`, error);
                }
            }
            
            renderFiles(allFiles);
            document.getElementById('fileCount').textContent = `Total: ${allFiles.length} documents`;
        }

        // 渲染文件列表
        function renderFiles(files) {
            const fileList = document.getElementById('fileList');
            
            if (files.length === 0) {
                fileList.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        <i class="fas fa-file-pdf text-4xl mb-4 text-gray-300"></i>
                        <p>No documents found in this category</p>
                    </div>
                `;
                return;
            }

            fileList.innerHTML = files.map(file => `
                <div class="p-4 hover:bg-gray-50 transition-colors file-item" data-category="${file.category}" data-name="${file.name.toLowerCase()}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center mr-4">
                                <i class="fas fa-file-pdf text-red-500"></i>
                            </div>
                            <div>
                                <h3 class="font-medium text-gray-800">${file.name}</h3>
                                <div class="flex items-center text-sm text-gray-500 mt-1">
                                    <span class="bg-gray-100 px-2 py-0.5 rounded text-xs mr-2">${file.category}</span>
                                    <span>${file.size} MB</span>
                                    <span class="mx-2">•</span>
                                    <span>Updated: ${file.lastUpdated}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button class="preview-btn px-3 py-1.5 bg-primary/10 text-primary rounded-lg text-sm font-medium hover:bg-primary/20 transition-colors" data-url="${file.url}" data-name="${file.name}">
                                <i class="fas fa-eye mr-1"></i>Preview
                            </button>
                            <a href="${file.url}" download="${file.filename}" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                                <i class="fas fa-download mr-1"></i>Download
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');

            // 绑定预览按钮事件
            document.querySelectorAll('.preview-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    const name = btn.getAttribute('data-name');
                    openPdfModal(url, name);
                });
            });
        }

        // 打开PDF预览模态框
        function openPdfModal(url, name) {
            const modal = document.getElementById('pdfModal');
            const viewer = document.getElementById('pdfViewer');
            const title = document.getElementById('pdfTitle');
            
            title.textContent = name;
            viewer.src = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(url)}`;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // 关闭PDF预览模态框
        function closePdfModal() {
            const modal = document.getElementById('pdfModal');
            const viewer = document.getElementById('pdfViewer');
            
            modal.classList.add('hidden');
            viewer.src = '';
            document.body.style.overflow = '';
        }

        // 分类切换
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 更新标签样式
                document.querySelectorAll('.category-tab').forEach(t => {
                    t.classList.remove('active', 'bg-primary', 'text-white');
                    t.classList.add('bg-white', 'text-secondary', 'hover:bg-gray-100');
                });
                tab.classList.add('active', 'bg-primary', 'text-white');
                tab.classList.remove('bg-white', 'text-secondary', 'hover:bg-gray-100');
                
                // 过滤文件
                currentCategory = tab.getAttribute('data-category');
                document.getElementById('currentCategoryTitle').textContent = 
                    currentCategory === 'all' ? 'All Documents' : currentCategory;
                
                filterFiles();
            });
        });

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', filterFiles);

        function filterFiles() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filteredFiles = allFiles;
            
            // 按分类过滤
            if (currentCategory !== 'all') {
                filteredFiles = filteredFiles.filter(file => file.category === currentCategory);
            }
            
            // 按搜索词过滤
            if (searchTerm) {
                filteredFiles = filteredFiles.filter(file => 
                    file.name.toLowerCase().includes(searchTerm) || 
                    file.category.toLowerCase().includes(searchTerm)
                );
            }
            
            renderFiles(filteredFiles);
            document.getElementById('fileCount').textContent = `Showing ${filteredFiles.length} of ${allFiles.length} documents`;
        }

        // 模态框关闭事件
        document.getElementById('closeModal').addEventListener('click', closePdfModal);
        document.getElementById('pdfModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('pdfModal')) {
                closePdfModal();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closePdfModal();
            }
        });

        // 页面加载时获取文件
        document.addEventListener('DOMContentLoaded', fetchAllFiles);
    </script>
</body>
</html>
